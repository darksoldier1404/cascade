org.gradle.jvmargs=-Xmx2G
org.gradle.caching=true

mod_id=cascade
mod_name=Cascade
mod_version=1.0.0+26.2
mod_group=dev.chocoboy.cascade
mod_license=MIT

# Minecraft 26.2 port. 26.x ships UNOBFUSCATED, so there are no mappings or parchment here, a real
# simplification over the 1.21.1 build. Building 26.2 needs a Java 25 JDK (the 1.21.1 build used 21).
minecraft_version=26.2
minecraft_version_range=[26.2,27)
java_version=25

neoforge_version=26.2.0.93
neoforge_loader_version_range=[4,)
neo_form_version=26.2-2

fabric_loader_version=0.20.1
fabric_api_version=0.161.0+26.2

